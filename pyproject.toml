[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "veltryq"
version = "0.2.0"
description = "Evidence-driven financial integrity checks for GitLab workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2.6,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.5,<1",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "build>=1.2,<2",
  "PyYAML>=6,<7",
  "pip-tools>=7.4,<8",
]

[project.scripts]
veltryq = "veltryq.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "veltryq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "BLE"]
