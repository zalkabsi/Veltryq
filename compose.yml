services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veltryq
      POSTGRES_USER: veltryq
      POSTGRES_PASSWORD: veltryq-local-only
    volumes:
      - synthetic-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veltryq -d veltryq"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      VELTRYQ_DATABASE_URL: postgresql+psycopg://veltryq:veltryq-local-only@db:5432/veltryq
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  workflow:
    build: .
    profiles: ["tools"]
    user: "${VELTRYQ_UID:-1000}:${VELTRYQ_GID:-1000}"
    environment:
      VELTRYQ_TEST_DATABASE_URL: postgresql+psycopg://veltryq:veltryq-local-only@db:5432/veltryq
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "veltryq.cli", "workflow", "--out", "artifacts/postgresql"]
    volumes:
      - ./artifacts:/workspace/artifacts
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  synthetic-db:
